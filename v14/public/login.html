<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PSNM — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c0f;--bg2:#111318;--bg3:#181c23;
  --border:#2a3040;--text:#e8eaf0;--muted:#8892a4;
  --gold:#f5a623;--red:#ef4444;
  --head:'Barlow Condensed',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:32px;width:100%;max-width:360px}
.brand{font-family:var(--head);font-weight:900;font-size:22px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.brand span{color:var(--text)}
.sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:28px}
.label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.inp{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:10px 12px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;outline:none;width:100%;transition:border-color 0.15s}
.inp:focus{border-color:var(--gold)}
.btn{display:block;width:100%;margin-top:16px;padding:11px;border-radius:4px;font-family:var(--head);font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:none;background:var(--gold);color:#0a0c0f;transition:background 0.15s}
.btn:hover:not(:disabled){background:#ffd166}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.err{font-family:var(--mono);font-size:11px;color:var(--red);margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">PSNM <span>WMS</span></div>
  <div class="sub">Pallet Storage Near Me</div>
  <div class="label">Password</div>
  <input id="pw" class="inp" type="password" autocomplete="off" autofocus/>
  <button id="btn" class="btn">Sign in</button>
  <div id="err" class="err"></div>
</div>
<script>
(function(){
  var pw  = document.getElementById('pw');
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');

  function showError(msg){
    err.textContent = msg;
    err.style.display = 'block';
  }

  function clearError(){
    err.textContent = '';
    err.style.display = 'none';
  }

  btn.addEventListener('click', function(){
    clearError();
    btn.disabled = true;
    btn.textContent = 'SIGNING IN…';

    fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw.value})
    })
    .then(function(r){
      if(r.ok){
        window.location = '/wms.html';
      } else if(r.status === 401){
        showError('Invalid password');
        pw.value = '';
        pw.focus();
        btn.disabled = false;
        btn.textContent = 'SIGN IN';
      } else {
        showError('Login failed, try again');
        btn.disabled = false;
        btn.textContent = 'SIGN IN';
      }
    })
    .catch(function(){
      showError('Login failed, try again');
      btn.disabled = false;
      btn.textContent = 'SIGN IN';
    });
  });

  pw.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ btn.click(); }
  });
}());
</script>
</body>
</html>
