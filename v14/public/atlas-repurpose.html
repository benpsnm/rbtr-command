<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS Repurposing Engine — RBTR Command Centre</title>
<link href="https://fonts.googleapis.com/css2?family=Ultra&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700;900&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --black:#000;--off-black:#0a0a0a;--card-bg:#0f0f0f;--card-border:#1a1a1a;--card-hover:#141414;
  --white:#fff;--off-white:#e8e8e8;--muted:#666;--accent:#ff4500;--accent2:#ff6b35;
  --accent-dim:rgba(255,69,0,0.15);--accent-glow:rgba(255,69,0,0.06);
  --green:#00c853;--blue:#1e90ff;--amber:#ffab00;--purple:#e040fb;
  --font-display:'Ultra','Cinzel Decorative',serif;--font-body:'Barlow',sans-serif;--font-cond:'Barlow Condensed',sans-serif;
  --radius:8px;--transition:0.18s ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--white);font-family:var(--font-body);font-size:14px;min-height:100vh;padding:26px;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:var(--off-black);}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px;}

/* HEADER */
.ph{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
.ph-logo{width:32px;height:32px;flex-shrink:0;}
.ph-titles .pt{font-family:var(--font-display);font-size:34px;letter-spacing:3px;line-height:1;}
.ph-titles .ps{font-family:var(--font-cond);font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-top:2px;}

/* CARD */
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px;transition:border-color var(--transition);margin-bottom:16px;}
.card:hover{border-color:#252525;}
.ct{font-family:var(--font-cond);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}

/* INPUTS */
input[type=text],input[type=email],input[type=date],input[type=number],textarea,select{background:#0a0a0a;border:1px solid var(--card-border);border-radius:var(--radius);color:var(--white);font-family:var(--font-body);font-size:13px;padding:7px 11px;width:100%;transition:border-color var(--transition);outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:120px;}
select option{background:#111;}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;font-family:var(--font-cond);letter-spacing:.5px;text-transform:uppercase;}
.field{margin-bottom:16px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius);font-family:var(--font-cond);font-size:12px;letter-spacing:.5px;cursor:pointer;transition:all var(--transition);border:1px solid var(--card-border);background:var(--card-bg);color:var(--white);text-decoration:none;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

/* CHECKBOXES */
.platforms{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.plat-check{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);cursor:pointer;transition:all var(--transition);}
.plat-check:hover{border-color:var(--accent);}
.plat-check.selected{border-color:var(--accent);background:var(--accent-dim);}
.plat-check input{cursor:pointer;}
.plat-check label{margin:0;cursor:pointer;font-size:12px;text-transform:none;}

/* VARIANTS */
.variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:24px;}
.variant{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;position:relative;}
.variant.instagram_post{border-left:3px solid var(--purple);}
.variant.instagram_reel{border-left:3px solid var(--purple);}
.variant.instagram_story{border-left:3px solid var(--purple);}
.variant.linkedin_post{border-left:3px solid var(--blue);}
.variant.linkedin_dm{border-left:3px solid var(--blue);}
.variant.twitter{border-left:3px solid var(--accent);}
.variant.youtube_short{border-left:3px solid var(--accent);}
.variant.youtube_long{border-left:3px solid var(--accent);}
.variant.newsletter{border-left:3px solid var(--green);}
.variant.facebook{border-left:3px solid var(--blue);}
.variant.tiktok{border-left:3px solid var(--purple);}
.vp{font-family:var(--font-cond);font-size:13px;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.vt{font-size:12px;line-height:1.7;white-space:pre-wrap;margin-bottom:12px;max-height:300px;overflow-y:auto;padding:10px;background:#0a0a0a;border-radius:var(--radius);}
.vm{font-size:10px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--card-border);}
.vf{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.vf span{font-size:9px;background:var(--accent-dim);color:var(--accent);padding:2px 6px;border-radius:3px;font-family:var(--font-cond);letter-spacing:.5px;}
.vcc{font-size:10px;color:var(--muted);}
.vactions{display:flex;gap:6px;margin-top:10px;}
.vactions button{padding:4px 9px;font-size:10px;}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted);font-family:var(--font-cond);letter-spacing:.5px;}
.spinner{border:2px solid var(--card-border);border-top-color:var(--accent);border-radius:50%;width:32px;height:32px;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ALERT */
.alert{padding:14px 16px;border-radius:var(--radius);font-size:12px;line-height:1.7;margin:12px 0;}
.alert.red{background:rgba(255,69,0,.1);border:1px solid rgba(255,69,0,.3);}
.alert.green{background:rgba(0,200,83,.1);border:1px solid rgba(0,200,83,.3);}
.alert.amber{background:rgba(255,171,0,.1);border:1px solid rgba(255,171,0,.3);}
</style>
</head>
<body>

<div class="ph">
  <svg class="ph-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#ff4500" stroke-width="3"/>
    <path d="M30,50 L50,30 L70,50 L50,70 Z" fill="#ff4500"/>
  </svg>
  <div class="ph-titles">
    <div class="pt">ATLAS REPURPOSE</div>
    <div class="ps">One input → Many platform-optimized outputs</div>
  </div>
</div>

<div class="card">
  <div class="ct">Input Content</div>

  <div class="field">
    <label for="content_type">Content Type</label>
    <select id="content_type">
      <option value="build_update">Build Update</option>
      <option value="idea">Idea</option>
      <option value="transcript">Transcript</option>
      <option value="photo_caption">Photo Caption</option>
      <option value="article">Article</option>
      <option value="news">News/Announcement</option>
    </select>
  </div>

  <div class="field">
    <label for="raw_input">Raw Input (the source content to repurpose)</label>
    <textarea id="raw_input" placeholder="Week 1 chassis strip complete. 300kg removed. Hudson helped with socket set..."></textarea>
  </div>

  <div class="field">
    <label for="context_notes">Context Notes (optional targeting/tone guidance)</label>
    <textarea id="context_notes" style="min-height:60px;" placeholder="First major milestone, family involvement..."></textarea>
  </div>

  <div class="field">
    <label>Select Target Platforms</label>
    <div class="platforms" id="platform_selector">
      <div class="plat-check" data-platform="instagram_post">
        <input type="checkbox" id="plat_instagram_post" value="instagram_post">
        <label for="plat_instagram_post">Instagram Post</label>
      </div>
      <div class="plat-check" data-platform="instagram_reel">
        <input type="checkbox" id="plat_instagram_reel" value="instagram_reel">
        <label for="plat_instagram_reel">Instagram Reel</label>
      </div>
      <div class="plat-check" data-platform="instagram_story">
        <input type="checkbox" id="plat_instagram_story" value="instagram_story">
        <label for="plat_instagram_story">Instagram Story</label>
      </div>
      <div class="plat-check" data-platform="linkedin_post">
        <input type="checkbox" id="plat_linkedin_post" value="linkedin_post">
        <label for="plat_linkedin_post">LinkedIn Post</label>
      </div>
      <div class="plat-check" data-platform="linkedin_dm">
        <input type="checkbox" id="plat_linkedin_dm" value="linkedin_dm">
        <label for="plat_linkedin_dm">LinkedIn DM</label>
      </div>
      <div class="plat-check" data-platform="twitter">
        <input type="checkbox" id="plat_twitter" value="twitter">
        <label for="plat_twitter">Twitter/X</label>
      </div>
      <div class="plat-check" data-platform="youtube_short">
        <input type="checkbox" id="plat_youtube_short" value="youtube_short">
        <label for="plat_youtube_short">YouTube Short</label>
      </div>
      <div class="plat-check" data-platform="youtube_long">
        <input type="checkbox" id="plat_youtube_long" value="youtube_long">
        <label for="plat_youtube_long">YouTube Video</label>
      </div>
      <div class="plat-check" data-platform="newsletter">
        <input type="checkbox" id="plat_newsletter" value="newsletter">
        <label for="plat_newsletter">Newsletter</label>
      </div>
      <div class="plat-check" data-platform="facebook">
        <input type="checkbox" id="plat_facebook" value="facebook">
        <label for="plat_facebook">Facebook</label>
      </div>
      <div class="plat-check" data-platform="tiktok">
        <input type="checkbox" id="plat_tiktok" value="tiktok">
        <label for="plat_tiktok">TikTok</label>
      </div>
    </div>
  </div>

  <button id="generate_btn" class="btn pri">Generate Variants</button>
</div>

<div id="results"></div>

<script>
const API_URL = '/api/atlas-repurpose';

// Platform checkbox interaction
document.querySelectorAll('.plat-check').forEach(el => {
  el.addEventListener('click', (e) => {
    if (e.target.tagName !== 'INPUT') {
      const checkbox = el.querySelector('input');
      checkbox.checked = !checkbox.checked;
    }
    el.classList.toggle('selected', el.querySelector('input').checked);
  });
});

// Generate button
document.getElementById('generate_btn').addEventListener('click', async () => {
  const content_type = document.getElementById('content_type').value;
  const raw_input = document.getElementById('raw_input').value.trim();
  const context_notes = document.getElementById('context_notes').value.trim();

  const platforms = Array.from(document.querySelectorAll('.plat-check input:checked')).map(cb => cb.value);

  if (!raw_input) {
    alert('Please enter raw input content');
    return;
  }

  if (platforms.length === 0) {
    alert('Please select at least one platform');
    return;
  }

  const resultsDiv = document.getElementById('results');
  const generateBtn = document.getElementById('generate_btn');

  generateBtn.disabled = true;
  generateBtn.textContent = 'Generating...';

  resultsDiv.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Generating ${platforms.length} platform variant${platforms.length > 1 ? 's' : ''}...</div>
    </div>
  `;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        content_type,
        raw_input,
        context_notes: context_notes || null,
        platforms,
        metadata: {}
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || 'Generation failed');
    }

    // Display success
    resultsDiv.innerHTML = `
      <div class="alert green">
        <strong>✓ Generated ${data.variants_generated} variant${data.variants_generated > 1 ? 's' : ''}</strong>
        Input ID: ${data.input_id}
      </div>
    `;

    // Display variants
    const variantsHTML = data.variants.map(v => {
      const frameworks = v.framework_applied && v.framework_applied.length > 0
        ? `<div class="vf">${v.framework_applied.map(f => `<span>${f}</span>`).join('')}</div>`
        : '';

      return `
        <div class="variant ${v.platform}">
          <div class="vp">${v.platform.replace(/_/g, ' ')}</div>
          ${frameworks}
          <div class="vt">${escapeHtml(v.generated_text)}</div>
          <div class="vcc">${v.character_count} characters</div>
          ${v.ai_reasoning ? `<div class="vm">${escapeHtml(v.ai_reasoning)}</div>` : ''}
          <div class="vactions">
            <button class="btn" onclick="copyVariant('${v.id}')">Copy</button>
            <button class="btn" onclick="editVariant('${v.id}')">Edit</button>
          </div>
        </div>
      `;
    }).join('');

    resultsDiv.innerHTML += `<div class="variants">${variantsHTML}</div>`;

  } catch (err) {
    resultsDiv.innerHTML = `
      <div class="alert red">
        <strong>Generation Failed</strong>
        ${escapeHtml(err.message)}
      </div>
    `;
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = 'Generate Variants';
  }
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function copyVariant(variantId) {
  const variantEl = document.querySelector(`.variant [onclick*="${variantId}"]`)?.closest('.variant');
  if (!variantEl) return;

  const text = variantEl.querySelector('.vt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    alert('Copied to clipboard!');
  });
}

function editVariant(variantId) {
  alert('Edit feature coming soon — variants stored in atlas_content_variants table');
}
</script>

</body>
</html>
