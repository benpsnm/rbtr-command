<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forge — Booking Calendar</title>
<style>
  :root {
    --bg: #1a1a1a;
    --surface: #242424;
    --border: #333;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #c8a96a;      /* warm gold — industrial luxury */
    --airbnb: #ff5a5f;
    --booking: #003580;
    --vrbo: #1b6ac9;
    --direct: #4a9b6f;
    --manual: #888;
    --selected: rgba(200,169,106,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
  header .subtitle { font-size: 12px; color: var(--muted); }

  .month-nav { display: flex; align-items: center; gap: 12px; }
  .month-nav button {
    background: var(--border);
    border: none;
    color: var(--text);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .month-nav button:hover { background: #444; }
  .month-nav .month-label { font-size: 15px; font-weight: 600; min-width: 160px; text-align: center; }

  /* ── Stats bar ── */
  .stats-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 16px; font-weight: 600; }
  .stat .value.good { color: #4a9b6f; }
  .stat .value.accent { color: var(--accent); }

  /* ── Main layout ── */
  .main { display: flex; height: calc(100vh - 97px); }

  /* ── Calendar ── */
  .calendar-wrap { flex: 1; overflow-y: auto; padding: 20px; }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .day-header {
    background: var(--surface);
    text-align: center;
    padding: 8px 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
  }

  .day {
    background: var(--bg);
    min-height: 90px;
    padding: 6px;
    cursor: default;
    position: relative;
    transition: background 0.1s;
  }
  .day:hover { background: #222; }
  .day.other-month { opacity: 0.3; }
  .day.today { background: rgba(200,169,106,0.06); }
  .day.today .day-num { color: var(--accent); font-weight: 700; }

  .day-num {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }

  /* Booking blocks inside day cells */
  .booking-block {
    border-radius: 3px;
    padding: 2px 5px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    color: #fff;
  }
  .booking-block.airbnb    { background: var(--airbnb); }
  .booking-block.booking_com { background: var(--booking); }
  .booking-block.vrbo      { background: var(--vrbo); }
  .booking-block.direct    { background: var(--direct); }
  .booking-block.manual    { background: var(--manual); }
  .booking-block.start     { border-radius: 3px 0 0 3px; margin-right: 0; padding-right: 2px; }
  .booking-block.mid       { border-radius: 0; margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
  .booking-block.end       { border-radius: 0 3px 3px 0; margin-left: 0; padding-left: 2px; }

  .nightly-rate {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 10px;
    color: var(--muted);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 300px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .sidebar h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .booking-detail {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }
  .booking-detail .bname {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }
  .booking-detail .brow {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
  }
  .booking-detail .brow:last-child { border-bottom: none; }
  .booking-detail .brow span:last-child { color: var(--text); font-weight: 500; }

  .platform-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }

  .upcoming-list { display: flex; flex-direction: column; gap: 8px; }
  .upcoming-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .upcoming-item:hover { border-color: var(--accent); border-left-color: var(--accent); }
  .upcoming-item .ui-name { font-size: 13px; font-weight: 600; }
  .upcoming-item .ui-dates { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .upcoming-item .ui-revenue { font-size: 11px; color: var(--direct); margin-top: 2px; }

  .legend {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ── Add booking button ── */
  .add-btn {
    background: var(--accent);
    color: #1a1a1a;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    margin-top: auto;
  }
  .add-btn:hover { opacity: 0.9; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    display: none;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    width: 420px;
    max-width: 95vw;
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  .form-row textarea { resize: vertical; min-height: 60px; }
  .form-row input:focus, .form-row select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .modal-actions button {
    padding: 8px 16px; border-radius: 4px; border: none;
    font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .btn-cancel { background: var(--border); color: var(--text); }
  .btn-save   { background: var(--accent); color: #1a1a1a; }

  .empty-state { text-align: center; color: var(--muted); padding: 20px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>The Forge — Booking Calendar</h1>
    <div class="subtitle">4 Woodhead Mews, Blacker Hill, Barnsley S74 0RH</div>
  </div>
  <div class="month-nav">
    <button onclick="prevMonth()">‹</button>
    <div class="month-label" id="monthLabel">—</div>
    <button onclick="nextMonth()">›</button>
  </div>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="label">This Month Gross</div><div class="value accent" id="statGross">—</div></div>
  <div class="stat"><div class="label">Net Revenue</div><div class="value good" id="statNet">—</div></div>
  <div class="stat"><div class="label">Nights Let</div><div class="value" id="statNights">—</div></div>
  <div class="stat"><div class="label">Occupancy</div><div class="value" id="statOcc">—</div></div>
  <div class="stat"><div class="label">Bookings</div><div class="value" id="statCount">—</div></div>
  <div class="stat"><div class="label">Avg Nightly</div><div class="value" id="statAvgRate">—</div></div>
</div>

<div class="main">
  <div class="calendar-wrap">
    <div class="calendar-grid" id="calGrid"></div>
  </div>
  <div class="sidebar">
    <div>
      <h3 style="margin-bottom:10px">Selected Booking</h3>
      <div id="selectedDetail" class="empty-state">Click a booking to see details</div>
    </div>
    <div>
      <h3 style="margin-bottom:10px">Upcoming (30 days)</h3>
      <div id="upcomingList" class="upcoming-list"></div>
    </div>
    <div>
      <h3 style="margin-bottom:10px">Legend</h3>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--airbnb)"></div>Airbnb</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--booking)"></div>Booking.com</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--vrbo)"></div>VRBO</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--direct)"></div>Direct</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--manual)"></div>Manual</div>
      </div>
    </div>
    <button class="add-btn" onclick="openAddModal()">+ Add Booking</button>
  </div>
</div>

<!-- Add Booking Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Add Booking</h2>
    <div class="form-row">
      <label>Guest Name</label>
      <input type="text" id="fGuestName" placeholder="e.g. James & Lucy Smith">
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>Check-in *</label>
        <input type="date" id="fCheckin">
      </div>
      <div class="form-row">
        <label>Check-out *</label>
        <input type="date" id="fCheckout">
      </div>
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>Platform</label>
        <select id="fPlatform">
          <option value="airbnb">Airbnb</option>
          <option value="booking_com">Booking.com</option>
          <option value="vrbo">VRBO</option>
          <option value="direct">Direct</option>
          <option value="manual">Manual</option>
        </select>
      </div>
      <div class="form-row">
        <label>Party Size</label>
        <input type="number" id="fPartySize" min="1" max="6" placeholder="1–6">
      </div>
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>Gross Revenue (£)</label>
        <input type="number" id="fGross" min="0" step="0.01" placeholder="e.g. 400">
      </div>
      <div class="form-row">
        <label>Platform Fee (£)</label>
        <input type="number" id="fFee" min="0" step="0.01" placeholder="e.g. 60">
      </div>
    </div>
    <div class="form-row">
      <label>Special Requests / Notes</label>
      <textarea id="fNotes" placeholder="Anniversary, dietary, late check-in..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn-save" onclick="saveBooking()">Save Booking</button>
    </div>
  </div>
</div>

<script>
  // ── Config ─────────────────────────────────────────────────────────────────
  const API_BASE = '/api/str/bookings';
  // Auth token — set via URL param ?token=xxx for local use
  const AUTH_TOKEN = new URLSearchParams(location.search).get('token') || '';

  const PLATFORM_COLORS = {
    airbnb: 'var(--airbnb)',
    booking_com: 'var(--booking)',
    vrbo: 'var(--vrbo)',
    direct: 'var(--direct)',
    manual: 'var(--manual)',
  };
  const PLATFORM_LABELS = {
    airbnb: 'Airbnb', booking_com: 'Booking.com',
    vrbo: 'VRBO', direct: 'Direct', manual: 'Manual',
  };

  // ── State ──────────────────────────────────────────────────────────────────
  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth(); // 0-based
  let allBookings = [];
  let selectedBooking = null;

  // ── API ────────────────────────────────────────────────────────────────────
  async function fetchBookings() {
    const headers = { 'Content-Type': 'application/json' };
    if (AUTH_TOKEN) headers['x-rbtr-auth'] = AUTH_TOKEN;

    // Fetch 3 months to handle bookings spanning month boundaries
    const from = new Date(viewYear, viewMonth - 1, 1).toISOString().slice(0,10);
    const to   = new Date(viewYear, viewMonth + 2, 0).toISOString().slice(0,10);

    const r = await fetch(`${API_BASE}?from=${from}&to=${to}&limit=500`, { headers });
    if (!r.ok) { console.error('Bookings fetch failed', r.status); return []; }
    const j = await r.json();
    return j.bookings || [];
  }

  async function postBooking(body) {
    const headers = { 'Content-Type': 'application/json' };
    if (AUTH_TOKEN) headers['x-rbtr-auth'] = AUTH_TOKEN;
    const r = await fetch(API_BASE, { method: 'POST', headers, body: JSON.stringify(body) });
    return r.json();
  }

  // ── Calendar render ────────────────────────────────────────────────────────
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function firstDayOfMonth(y, m) { return new Date(y, m, 1).getDay(); } // 0=Sun

  function bookingsForDate(dateStr) {
    return allBookings.filter(b => b.check_in <= dateStr && b.check_out > dateStr);
  }

  function renderCalendar() {
    const grid = document.getElementById('calGrid');
    const today = new Date().toISOString().slice(0,10);
    const monthDays = daysInMonth(viewYear, viewMonth);
    const startDay = (firstDayOfMonth(viewYear, viewMonth) + 6) % 7; // Mon=0
    const totalCells = Math.ceil((startDay + monthDays) / 7) * 7;

    const monthStr = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    document.getElementById('monthLabel').textContent = monthStr;

    let html = '';
    const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    for (const d of dayNames) html += `<div class="day-header">${d}</div>`;

    for (let i = 0; i < totalCells; i++) {
      const dayNum = i - startDay + 1;
      const isCurrentMonth = dayNum >= 1 && dayNum <= monthDays;
      const dateStr = isCurrentMonth
        ? `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`
        : null;

      const isToday = dateStr === today;
      const bks = dateStr ? bookingsForDate(dateStr) : [];

      html += `<div class="day${!isCurrentMonth ? ' other-month' : ''}${isToday ? ' today' : ''}">`;
      if (dayNum >= 1) {
        html += `<div class="day-num">${isCurrentMonth ? dayNum : ''}</div>`;
      }

      for (const b of bks) {
        const isStart = b.check_in === dateStr;
        const isEnd   = b.check_out === (() => { const d = new Date(dateStr); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
        const posClass = isStart ? 'start' : (b.check_out === (() => { const d = new Date(dateStr); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })() ? 'end' : 'mid');
        const label = isStart ? (b.guest_name || PLATFORM_LABELS[b.platform] || '—') : '';
        html += `<div class="booking-block ${b.platform} ${posClass}" onclick='selectBooking("${b.id}")' title="${b.guest_name || ''} (${PLATFORM_LABELS[b.platform]})">${label}</div>`;
      }

      if (dateStr && bks.length === 0 && isCurrentMonth) {
        // Show nightly pricing guidance for unbooked nights
        // (this would come from a pricing table — placeholder for now)
      }

      html += `</div>`;
    }
    grid.innerHTML = html;

    updateStats();
    updateUpcoming();
  }

  function updateStats() {
    const monthStart = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-01`;
    const monthEnd   = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(daysInMonth(viewYear,viewMonth)).padStart(2,'0')}`;

    const monthBks = allBookings.filter(b => b.check_in <= monthEnd && b.check_out > monthStart);
    const totalDays = daysInMonth(viewYear, viewMonth);
    let nightsLet = 0, gross = 0, net = 0;

    for (const b of monthBks) {
      const checkIn  = new Date(Math.max(new Date(b.check_in), new Date(monthStart)));
      const checkOut = new Date(Math.min(new Date(b.check_out), new Date(monthEnd)));
      const nights = Math.max(0, (checkOut - checkIn) / 86400000);
      nightsLet += nights;
      // Prorate revenue to this month's portion if booking spans months
      const totalNights = b.nights || 0;
      if (totalNights > 0) {
        gross += (b.gross_revenue || 0) * (nights / totalNights);
        net   += (b.net_revenue   || 0) * (nights / totalNights);
      }
    }

    const occ = totalDays > 0 ? (nightsLet / totalDays * 100) : 0;
    const avgRate = nightsLet > 0 ? (gross / nightsLet) : 0;

    document.getElementById('statGross').textContent  = gross  ? `£${Math.round(gross).toLocaleString()}` : '—';
    document.getElementById('statNet').textContent    = net    ? `£${Math.round(net).toLocaleString()}`   : '—';
    document.getElementById('statNights').textContent = nightsLet ? Math.round(nightsLet) : '—';
    document.getElementById('statOcc').textContent    = occ    ? `${Math.round(occ)}%` : '—';
    document.getElementById('statCount').textContent  = monthBks.length || '—';
    document.getElementById('statAvgRate').textContent = avgRate ? `£${Math.round(avgRate)}` : '—';
  }

  function updateUpcoming() {
    const today = new Date().toISOString().slice(0,10);
    const in30  = new Date(Date.now() + 30*86400000).toISOString().slice(0,10);
    const upcoming = allBookings
      .filter(b => b.check_in >= today && b.check_in <= in30 && b.status !== 'cancelled')
      .sort((a,b) => a.check_in.localeCompare(b.check_in));

    const el = document.getElementById('upcomingList');
    if (!upcoming.length) { el.innerHTML = '<div class="empty-state">No bookings in next 30 days</div>'; return; }

    el.innerHTML = upcoming.map(b => `
      <div class="upcoming-item" onclick='selectBooking("${b.id}")'>
        <div class="ui-name">${b.guest_name || '(no name)'}</div>
        <div class="ui-dates">${fmtDate(b.check_in)} → ${fmtDate(b.check_out)} · ${b.nights}n</div>
        <div class="ui-revenue">${PLATFORM_LABELS[b.platform] || b.platform}${b.gross_revenue ? ` · £${b.gross_revenue}` : ''}</div>
      </div>
    `).join('');
  }

  function selectBooking(id) {
    selectedBooking = allBookings.find(b => b.id === id);
    if (!selectedBooking) return;
    const b = selectedBooking;
    const platformColor = PLATFORM_COLORS[b.platform] || PLATFORM_COLORS.manual;

    document.getElementById('selectedDetail').innerHTML = `
      <div class="booking-detail">
        <div class="platform-badge" style="background:${platformColor}">${PLATFORM_LABELS[b.platform] || b.platform}</div>
        <div class="bname">${b.guest_name || '(unnamed guest)'}</div>
        <div class="brow"><span>Check-in</span><span>${fmtDate(b.check_in)}</span></div>
        <div class="brow"><span>Check-out</span><span>${fmtDate(b.check_out)}</span></div>
        <div class="brow"><span>Nights</span><span>${b.nights}</span></div>
        <div class="brow"><span>Party size</span><span>${b.party_size || '—'}</span></div>
        <div class="brow"><span>Gross</span><span>${b.gross_revenue ? '£' + b.gross_revenue : '—'}</span></div>
        <div class="brow"><span>Platform fee</span><span>${b.platform_fee ? '£' + b.platform_fee : '—'}</span></div>
        <div class="brow"><span>Net</span><span style="color:var(--direct)">${b.net_revenue ? '£' + Number(b.net_revenue).toFixed(2) : '—'}</span></div>
        <div class="brow"><span>Status</span><span>${b.status}</span></div>
        ${b.special_requests ? `<div class="brow"><span>Requests</span><span style="max-width:140px;word-break:break-word">${b.special_requests}</span></div>` : ''}
        ${b.notes ? `<div class="brow"><span>Notes</span><span style="max-width:140px;word-break:break-word">${b.notes}</span></div>` : ''}
        <div class="brow"><span>Review left?</span><span>${b.review_left ? (b.review_rating ? '★ ' + b.review_rating : 'Yes') : 'No'}</span></div>
      </div>
    `;
  }

  // ── Modal ──────────────────────────────────────────────────────────────────
  function openAddModal() {
    document.getElementById('addModal').classList.add('open');
    document.getElementById('fCheckin').valueAsDate = new Date();
  }
  function closeAddModal() {
    document.getElementById('addModal').classList.remove('open');
  }

  async function saveBooking() {
    const checkin  = document.getElementById('fCheckin').value;
    const checkout = document.getElementById('fCheckout').value;
    if (!checkin || !checkout) { alert('Check-in and check-out are required.'); return; }
    if (checkout <= checkin)   { alert('Check-out must be after check-in.'); return; }

    const gross = parseFloat(document.getElementById('fGross').value) || undefined;
    const fee   = parseFloat(document.getElementById('fFee').value)   || undefined;

    const body = {
      guest_name:       document.getElementById('fGuestName').value.trim() || undefined,
      check_in:         checkin,
      check_out:        checkout,
      platform:         document.getElementById('fPlatform').value,
      party_size:       parseInt(document.getElementById('fPartySize').value) || undefined,
      gross_revenue:    gross,
      platform_fee:     fee,
      special_requests: document.getElementById('fNotes').value.trim() || undefined,
      status:           'confirmed',
    };

    const result = await postBooking(body);
    if (result.ok) {
      closeAddModal();
      await refresh();
    } else {
      alert('Error saving booking: ' + (result.error || 'unknown'));
    }
  }

  // ── Navigation ─────────────────────────────────────────────────────────────
  function prevMonth() {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    refresh();
  }
  function nextMonth() {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    refresh();
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  async function refresh() {
    allBookings = await fetchBookings();
    renderCalendar();
  }

  refresh();
</script>
</body>
</html>
