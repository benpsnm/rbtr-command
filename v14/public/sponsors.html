<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0d0d0d;
    --surface:  #161616;
    --border:   #2a2a2a;
    --text:     #e8e8e8;
    --muted:    #888;
    --accent:   #f5a623;
    --green:    #4ade80;
    --red:      #f87171;
    --blue:     #60a5fa;
    --yellow:   #facc15;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

  /* ── Header ── */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
  .header .sub { color: var(--muted); font-size: 12px; }
  .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  /* ── Buttons ── */
  .btn {
    padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn:not(:disabled):hover { opacity: 0.85; }
  .btn-primary   { background: var(--accent); color: #000; }
  .btn-ghost     { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-approve   { background: #166534; color: var(--green); }
  .btn-skip      { background: #7f1d1d; color: var(--red); }
  .btn-small     { padding: 5px 10px; font-size: 12px; }

  /* ── Stats bar ── */
  .stats-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; gap: 24px; flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-value.green  { color: var(--green); }
  .stat-value.yellow { color: var(--yellow); }
  .stat-value.muted  { color: var(--muted); }

  /* ── Progress bar ── */
  .progress-wrap {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: none;
  }
  .progress-wrap.visible { display: block; }
  .progress-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .progress-bar-bg { background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; }
  .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 4px; transition: width 0.3s; width: 0%; }
  .progress-log { font-size: 12px; color: var(--muted); margin-top: 8px; font-family: monospace; max-height: 80px; overflow-y: auto; }

  /* ── Filters ── */
  .filter-bar {
    padding: 12px 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .filter-select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  .filter-label { color: var(--muted); font-size: 12px; }

  /* ── Card grid ── */
  .cards { padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; }

  /* ── Draft card ── */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; transition: border-color 0.2s;
  }
  .card.approved  { border-color: #166534; }
  .card.skipped   { border-color: #7f1d1d; opacity: 0.6; }
  .card-header {
    padding: 14px 18px; display: flex; align-items: flex-start; gap: 12px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .card-meta { flex: 1; }
  .sponsor-name { font-size: 16px; font-weight: 700; }
  .sponsor-cat  { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .subject-line { font-size: 13px; color: var(--blue); margin-top: 6px; font-style: italic; }
  .card-badges  { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; margin-left: auto; }
  .badge {
    padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge-high    { background: #14532d; color: var(--green); }
  .badge-medium  { background: #713f12; color: var(--yellow); }
  .badge-low     { background: #1e3a5f; color: var(--blue); }
  .badge-pending { background: #1c1c1c; color: var(--muted); border: 1px solid var(--border); }
  .badge-approved{ background: #14532d; color: var(--green); }
  .badge-skipped { background: #450a0a; color: var(--red); }

  .card-body { padding: 16px 18px; }
  .email-body {
    white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: #ccc;
    font-family: Georgia, serif; border-left: 3px solid var(--border);
    padding-left: 14px; margin-bottom: 14px;
  }
  .asks-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .ask-pill { background: #1a1a2e; border: 1px solid #2d2d5e; color: #93c5fd; font-size: 11px; padding: 3px 8px; border-radius: 10px; }
  .why-line { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .value-line { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 14px; }

  .card-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 60px 24px; color: var(--muted); }
  .empty h2 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .empty p  { font-size: 14px; }

  /* ── Notice ── */
  .notice {
    margin: 24px; padding: 16px 20px; border-radius: 8px;
    background: #1a1400; border: 1px solid #5c4500; color: var(--yellow);
    font-size: 13px; line-height: 1.6;
  }
  .notice code { background: #2a2000; padding: 2px 6px; border-radius: 4px; font-size: 12px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--border); }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
</style>
</head>

// ── State ───────────────────────────────────────────────────────────────────
let allDrafts    = [];

// ── Auth helpers ─────────────────────────────────────────────────────────────
function getAuthHeaders() {
  const token = localStorage.getItem('rbtr_auth') || AUTH_TOKEN;
  const h = { 'Content-Type': 'application/json' };
  if (token) h['x-rbtr-auth'] = token;
  return h;
}

// ── Supabase reads via proxy ─────────────────────────────────────────────────
async function sbGet(table, qs = '') {
  const r = await fetch(`/api/supabase-proxy?table=${table}&${qs}`, { headers: getAuthHeaders() });
  if (!r.ok) return [];
  const d = await r.json();
  return Array.isArray(d) ? d : (d.data || []);
}

// ── Load drafts ──────────────────────────────────────────────────────────────
async function loadDrafts() {
  document.getElementById('header-sub').textContent = 'Loading…';
  try {
    const rows = await sbGet('psnm_sponsor_outreach', 'order=created_at.asc&limit=200');
    allDrafts = rows;
    updateStats();
    updateCategoryFilter();
    renderCards();
    document.getElementById('header-sub').textContent = `${rows.length} drafts · Last refreshed ${new Date().toLocaleTimeString('en-GB')}`;
    if (rows.length === 0) showNotice();
    else hideNotice();
  } catch (e) {
    document.getElementById('header-sub').textContent = 'Error loading — check table exists';
    showNotice();
  }
}

  sponsor_category      text,
  contact_email_guess   text,
  contact_role_guess    text,
  draft_subject         text,
  draft_body            text,
  asks                  jsonb DEFAULT '[]',
  why_we_picked_them    text,
  sponsor_value_estimate text,
  follow_up_status      text DEFAULT 'none',
  status                text DEFAULT 'draft_pending_review',
  confidence            text DEFAULT 'medium',
  notes                 text,
  created_at            timestamptz DEFAULT now(),
  updated_at            timestamptz DEFAULT now()
);
ALTER TABLE psnm_sponsor_outreach ENABLE ROW LEVEL SECURITY;</code>
      <br>Then click <strong>Generate All Drafts</strong>.
    </div>`;
}

function hideNotice() {
  document.getElementById('notice-area').innerHTML = '';
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats() {
  const pending  = allDrafts.filter(d => d.status === 'draft_pending_review').length;
  const approved = allDrafts.filter(d => d.status === 'approved').length;
  const skipped  = allDrafts.filter(d => d.status === 'skipped').length;
  const totalVal = allDrafts.filter(d => d.status !== 'skipped').reduce((sum, d) => {
    const m = (d.sponsor_value_estimate || '').match(/[\d,]+/);
    return sum + (m ? parseInt(m[0].replace(/,/g, '')) : 0);
  }, 0);
  document.getElementById('stat-total').textContent    = allDrafts.length;
  document.getElementById('stat-pending').textContent  = pending;
  document.getElementById('stat-approved').textContent = approved;
  document.getElementById('stat-skipped').textContent  = skipped;
  document.getElementById('stat-value').textContent    = totalVal > 0 ? `£${totalVal.toLocaleString('en-GB')}` : '–';
}

function updateCategoryFilter() {
  const cats = [...new Set(allDrafts.map(d => d.sponsor_category).filter(Boolean))].sort();
  const sel  = document.getElementById('filter-category');
  const cur  = sel.value;
  sel.innerHTML = '<option value="all">All categories</option>';
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    if (c === cur) o.selected = true;
    sel.appendChild(o);
  });
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderCards() {
  const statusF    = document.getElementById('filter-status').value;
  const confF      = document.getElementById('filter-confidence').value;
  const catF       = document.getElementById('filter-category').value;
  const container  = document.getElementById('cards-container');

  let filtered = allDrafts;
  if (statusF !== 'all') filtered = filtered.filter(d => d.status === statusF);
  if (confF   !== 'all') filtered = filtered.filter(d => d.confidence === confF);
  if (catF    !== 'all') filtered = filtered.filter(d => d.sponsor_category === catF);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty"><h2>${allDrafts.length === 0 ? 'No drafts yet' : 'No matches'}</h2><p>${allDrafts.length === 0 ? 'Click "Generate All Drafts" to start.' : 'Try changing the filters above.'}</p></div>`;
    return;
  }

  container.innerHTML = filtered.map(d => cardHTML(d)).join('');
}

function badgeClass(conf) {
  if (conf === 'high')   return 'badge-high';
  if (conf === 'medium') return 'badge-medium';
  return 'badge-low';
}
function statusBadgeClass(s) {
  if (s === 'approved')             return 'badge-approved';
  if (s === 'skipped')              return 'badge-skipped';
  if (s === 'draft_pending_review') return 'badge-pending';
  return 'badge-pending';
}
function statusLabel(s) {
  if (s === 'draft_pending_review') return 'Pending review';
  if (s === 'approved')             return '✓ Approved';
  if (s === 'skipped')              return '✗ Skipped';
  return s;
}

function cardHTML(d) {
  const asks = (() => {
    try { return JSON.parse(d.asks || '[]'); } catch { return []; }
  })();
  const bodyEscaped = (d.draft_body || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return `
  <div class="card ${d.status === 'approved' ? 'approved' : d.status === 'skipped' ? 'skipped' : ''}" id="card-${d.id}">
    <div class="card-header">
      <div class="card-meta">
        <div class="sponsor-name">${d.sponsor_name}</div>
        <div class="sponsor-cat">${d.sponsor_category || ''} ${d.sponsor_value_estimate ? `· ${d.sponsor_value_estimate}` : ''}</div>
        ${d.draft_subject ? `<div class="subject-line">"${d.draft_subject}"</div>` : ''}
      </div>
      <div class="card-badges">
        <span class="badge ${badgeClass(d.confidence)}">${d.confidence || 'medium'}</span>
        <span class="badge ${statusBadgeClass(d.status)}">${statusLabel(d.status)}</span>
      </div>
    </div>
    <div class="card-body">
      ${d.draft_body ? `<div class="email-body">${bodyEscaped}</div>` : '<div class="email-body" style="color:var(--muted)">No body generated yet</div>'}
      ${asks.length > 0 ? `<div class="asks-row">${asks.map(a => `<span class="ask-pill">${a}</span>`).join('')}</div>` : ''}
      ${d.why_we_picked_them ? `<div class="why-line">Why: ${d.why_we_picked_them}</div>` : ''}
      <div class="card-actions">
        ${d.status !== 'approved' ? `<button class="btn btn-approve btn-small" onclick="setStatus('${d.id}', 'approved')">✓ Approve</button>` : ''}
        ${d.status !== 'skipped'  ? `<button class="btn btn-skip btn-small"    onclick="setStatus('${d.id}', 'skipped')">✗ Skip</button>` : ''}
        ${d.status !== 'draft_pending_review' ? `<button class="btn btn-ghost btn-small" onclick="setStatus('${d.id}', 'draft_pending_review')">↩ Reset</button>` : ''}
      </div>
    </div>
  </div>`;
}

// ── Approve / skip ───────────────────────────────────────────────────────────
async function setStatus(id, status) {
  const r = await fetch('/api/sponsors/approve', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ id, status }),
  });
  if (!r.ok) { alert('Failed to update status'); return; }
  const idx = allDrafts.findIndex(d => d.id === id);
  if (idx >= 0) allDrafts[idx].status = status;
  updateStats();
  renderCards();
}

async function approveAll() {
  const pending = allDrafts.filter(d => d.status === 'draft_pending_review');
  if (pending.length === 0) { alert('No pending drafts to approve.'); return; }
  if (!confirm(`Approve all ${pending.length} pending drafts?`)) return;
  for (const d of pending) await setStatus(d.id, 'approved');
}

// ── Batch generator ──────────────────────────────────────────────────────────
async function startBatch() {
  if (batchRunning) return;

  const existing = allDrafts.map(d => d.sponsor_name);
  const toRun    = SPONSOR_LIST.filter(s => !existing.includes(s.brand_name));

  if (toRun.length === 0) {
    alert('All sponsors already have drafts. Refresh to see them.');
    return;
  }

  if (!confirm(`Generate ${toRun.length} outreach drafts?\n\nThis calls the Claude API for each sponsor (2 seconds between calls).\nEstimated time: ~${Math.ceil(toRun.length * 5 / 60)} minutes.\n\nCost: ~£${(toRun.length * 0.003).toFixed(2)} API cost.\n\nGo?`)) return;

  batchRunning = true;
  document.getElementById('btn-generate').disabled = true;
  document.getElementById('progress-wrap').classList.add('visible');

  let done = 0, errors = 0;
  const log = document.getElementById('progress-log');

  for (const s of toRun) {
    const pct = Math.round((done / toRun.length) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = `Generating: ${s.brand_name} (${done + 1}/${toRun.length})`;
    log.textContent = `[${done + 1}/${toRun.length}] ${s.brand_name}…`;
    log.scrollTop = log.scrollHeight;

    try {
      const r = await fetch('/api/sponsors/draft', {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify({
          sponsor_name:     s.brand_name,
          sponsor_category: s.category,
          ask_summary:      s.ask,
          ask_value_gbp:    s.value,
          hq_country:       s.hq,
          notes:            s.notes || '',
        }),
      });

      if (r.ok) {
        const data = await r.json();
        allDrafts.push({
          id: data.draft?.id || `tmp-${Date.now()}`,
          sponsor_name: s.brand_name,
          sponsor_category: s.category,
          draft_subject: data.subject,
          draft_body: data.draft?.draft_body,
          asks: data.draft?.asks || '[]',
          why_we_picked_them: data.draft?.why_we_picked_them,
          sponsor_value_estimate: data.draft?.sponsor_value_estimate || `£${s.value}`,
          confidence: data.confidence || 'medium',
          status: 'draft_pending_review',
        });
        log.textContent = `✓ ${s.brand_name} — "${data.subject}"`;
      } else {
        const err = await r.text();
        log.textContent = `✗ ${s.brand_name} — ${err.slice(0, 100)}`;
        errors++;
      }
    } catch (e) {
      log.textContent = `✗ ${s.brand_name} — ${e.message}`;
      errors++;
    }

    done++;
    updateStats();
    renderCards();

    if (done < toRun.length) await new Promise(r => setTimeout(r, 2000));
  }

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent =
    `Done! ${done - errors} generated, ${errors} errors.`;
  batchRunning = false;
  document.getElementById('btn-generate').disabled = false;

  // Final reload from DB
  setTimeout(loadDrafts, 1500);
}

// ── Auth check ───────────────────────────────────────────────────────────────
async function checkAuth() {
  const stored = localStorage.getItem('rbtr_auth');
  if (!stored) {
    const token = prompt('Enter RBTR auth token:');
    if (token) localStorage.setItem('rbtr_auth', token);
  }
}

// ── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  await checkAuth();
  await loadDrafts();
})();
</script>
